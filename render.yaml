services:
  - type: web
    name: rapido-backend
    runtime: python
    plan: free
    rootDir: rapido_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

  - type: web
    name: rapido-frontend
    runtime: static
    rootDir: rapido_frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rapido-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
